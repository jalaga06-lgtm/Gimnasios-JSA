services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gym
      POSTGRES_PASSWORD: gympass
      POSTGRES_DB: gym
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gym -d gym"]
      interval: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://gym:gympass@db:5432/gym?schema=public
      JWT_SECRET: cambia-esto-en-produccion
      PORT: 3000
      SEED_DEMO: "true"
    depends_on:
      db: { condition: service_healthy }
    ports: ["3000:3000"]
  frontend:
    build: ./frontend
    ports: ["8080:80"]
    depends_on: [backend]
volumes:
  pgdata: {}
